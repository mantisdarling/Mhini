name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Detect unused exports
        run: pnpm run check:unused-exports
      - name: Check service-worker policy
        run: pnpm run check:service-worker
      - name: Type check
        run: pnpm run check
      - name: Run tests
        run: pnpm test
      - name: Build production artifacts
        run: pnpm build
      - name: Scan repository secrets
        run: pnpm run security:secrets
